<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbyssTCG · 深渊对决</title>
</head>
<body>

<div id="screen-menu" class="screen">
  <h1 class="title">⚔️ AbyssTCG · 深渊对决</h1>
  <p class="subtitle">原创卡牌对战 · 选择模式开始游戏</p>
  <div class="mode-select">
    <div class="mode-card" id="mode-classic">
      <div class="mode-icon">🗡️</div>
      <div class="mode-name">经典 1v1</div>
      <div class="mode-desc">回合制卡牌对战<br>选择阵营 · 抽牌 · 出牌 · 攻击</div>
    </div>
    <div class="mode-card" id="mode-autobattler">
      <div class="mode-icon">♟️</div>
      <div class="mode-name">战棋模式</div>
      <div class="mode-desc">8 人自走棋 · 商店购买 · 三合升星<br>自动战斗 · 存活棋子结算伤害</div>
    </div>
  </div>
  <div id="faction-grid" class="faction-grid hidden"></div>
  <p class="mvp-note">战棋模式为全新开发中功能，棋子与平衡性会持续调整。</p>
</div>

<div id="screen-battle" class="screen hidden">
  <div class="hero-row hero-row-ai">
    <div id="hero-ai-portrait" class="hero-portrait" title="点击进行攻击">
      <div class="hero-hp">❤️ <span id="hero-ai-hp"></span></div>
    </div>
    <div class="hero-info">
      <div id="hero-ai-faction" class="hero-faction"></div>
      <div class="hero-mana">💧 <span id="hero-ai-mana"></span></div>
      <div id="hero-ai-deck" class="hero-deck"></div>
    </div>
  </div>

  <div id="board-ai" class="board"></div>
  <div class="board-divider"></div>
  <div id="board-player" class="board"></div>

  <div class="hero-row hero-row-player">
    <div id="hero-player-portrait" class="hero-portrait">
      <div class="hero-hp">❤️ <span id="hero-player-hp"></span></div>
    </div>
    <div class="hero-info">
      <div id="hero-player-faction" class="hero-faction"></div>
      <div class="hero-mana">💧 <span id="hero-player-mana"></span></div>
      <div id="hero-player-deck" class="hero-deck"></div>
    </div>
    <button id="btn-end-turn" class="btn-end-turn">结束回合 ▶</button>
  </div>

  <div id="hand-player" class="hand"></div>

  <div id="log-box" class="log-box"></div>
</div>

<div id="screen-autobattler" class="screen hidden">
  <div class="ab-topbar">
    <button id="ab-back" class="btn-small">← 返回菜单</button>
    <span id="ab-round" class="ab-round">第 1 回合</span>
    <span id="ab-phase" class="ab-phase">准备阶段</span>
    <div class="ab-auth-area">
      <span id="ab-auth-name" class="ab-auth-name">未登录</span>
      <button id="ab-auth-btn" class="btn-small">GitHub 登录</button>
    </div>
  </div>

  <div id="ab-standings" class="ab-standings"></div>

  <div class="ab-battle-area">
    <div id="ab-enemy-board" class="ab-board ab-enemy-board">
      <div class="ab-row-label">敌方前排</div>
      <div class="ab-front-row" id="ab-enemy-front"></div>
      <div class="ab-row-label">敌方后排</div>
      <div class="ab-back-row" id="ab-enemy-back"></div>
    </div>
    <div class="ab-vs">⚔️</div>
    <div id="ab-player-board" class="ab-board ab-player-board">
      <div class="ab-row-label">我方前排</div>
      <div class="ab-front-row" id="ab-player-front"></div>
      <div class="ab-row-label">我方后排</div>
      <div class="ab-back-row" id="ab-player-back"></div>
    </div>
  </div>

  <div id="ab-combat-log" class="ab-combat-log hidden"></div>

  <div id="ab-combat-controls" class="ab-combat-controls hidden">
    <button id="ab-next-round" class="btn-ab btn-ready">➡ 下一回合</button>
  </div>

  <div id="ab-shop-area" class="ab-shop-area">
    <div id="ab-bench-area" class="ab-bench-area">
      <div id="ab-bench" class="ab-bench"></div>
    </div>
    <div id="ab-shop" class="ab-shop"></div>
    <div class="ab-controls">
      <button id="ab-reroll" class="btn-ab">🔄 刷新 (1💰)</button>
      <button id="ab-levelup" class="btn-ab">⬆ 升级 (4💰)</button>
      <button id="ab-ready" class="btn-ab btn-ready">✅ 准备战斗</button>
    </div>
  </div>

  <div id="ab-player-info" class="ab-player-info"></div>
</div>

<div id="game-over-overlay" class="overlay hidden">
  <div class="overlay-box">
    <div id="game-over-text" class="overlay-text"></div>
    <button id="btn-play-again" class="btn-primary">返回主菜单</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
